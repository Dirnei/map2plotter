[project]
name = "map2plotter"
version = "0.3.0"
description = "Generate beautiful, minimalist map posters for any city in the world."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ankur Gupta", email = "originalankur@github.com"}
]
maintainers = [
    {name = "Christian Dirnhofer"}
]
keywords = ["map", "poster", "osm", "openstreetmap", "art", "visualization"]

dependencies = [
    "fastapi>=0.141,<1",
    "geopandas>=1.1,<2",
    "geopy>=2.4,<3",
    "Hershey-Fonts>=2.1,<3",
    "lat-lon-parser>=1.3,<2",
    "networkx>=3.6,<4",
    "numpy>=2.4,<3",
    "osmnx>=2.0.7,<3",
    "pydantic>=2.13,<3",
    "requests>=2.32,<3",
    "scipy>=1.16,<2",
    "shapely>=2.1,<3",
    "tqdm>=4.67,<5",
    "uvicorn>=0.53,<1",
]

[project.urls]
Homepage = "https://github.com/Dirnei/map2plotter"
Source = "https://github.com/Dirnei/map2plotter"
Issues = "https://github.com/Dirnei/map2plotter/issues"
"Original project" = "https://github.com/originalankur/maptoposter"

[project.scripts]
map2plotter = "map2plotter.poster:main"
map2plotter-web = "map2plotter.web:main"

[dependency-groups]
dev = [
    "flake8>=7.3",
    "httpx>=0.28",
    "pytest>=9.1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
map2plotter = ["data/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
