[project]
name = "maptoposter"
version = "0.2.0"
description = "Generate beautiful, minimalist map posters for any city in the world."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ankur Gupta", email = "originalankur@github.com"}
]
keywords = ["map", "poster", "osm", "openstreetmap", "art", "visualization"]

dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "click==8.5.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fastapi==0.141.1",
    "fonttools==4.61.1",
    "geographiclib==2.1",
    "geopandas==1.1.2",
    "geopy==2.4.1",
    "h11==0.16.0",
    "Hershey-Fonts==2.1.0",
    "idna==3.20",
    "kiwisolver==1.4.9",
    "lat-lon-parser==1.3.1",
    "matplotlib==3.10.8",
    "networkx==3.6.1",
    "numpy==2.4.0",
    "osmnx==2.0.7",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==12.1.0",
    "pydantic-core==2.46.5",
    "pydantic==2.13.5",
    "pyogrio==0.12.1",
    "pyparsing==3.3.1",
    "pyproj==3.7.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "requests==2.32.5",
    "scipy==1.16.3",
    "shapely==2.1.2",
    "six==1.17.0",
    "starlette==1.7.0",
    "tqdm==4.67.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "tzdata==2025.3",
    "urllib3==2.6.3",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["create_map_poster", "overpass_servers", "plotter_svg"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
